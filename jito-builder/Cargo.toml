[package]
name = "jito-builder"
description = "Jito BAM block builder & scheduler daemon for Agave validator"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[dependencies]
agave-logger = { workspace = true }
agave-scheduler-bindings = { workspace = true }
agave-scheduler-handshake = { workspace = true }
agave-scheduling-utils = { workspace = true, features = ["agave-unstable-api"] }
anyhow = { workspace = true }
arc-swap = { workspace = true }
bincode = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
crossbeam-channel = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
jito-protos = { workspace = true }
jsonrpc-core = { workspace = true }
jsonrpc-core-client = { workspace = true, features = ["ipc"] }
log = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
rdtsc = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rts-alloc = { workspace = true }
rustc-hash = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shaq = { workspace = true }
smallvec = { workspace = true }
solana-clock = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true, features = ["std", "curve25519", "sha2"] }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
spl-memo-interface = { workspace = true }
thiserror = { workspace = true }
tip-manager = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-stream = { workspace = true }
tonic = { workspace = true, features = ["channel", "tls-webpki-roots"] }

[lints]
workspace = true
